worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/x-font-ttf image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Rate limiting sur les appels API directs (outils externes, monitoring)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # Rate limiting sur le proxy du dashboard (/api/proxy). Un usage humain du
    # tableau de bord fait ~10-30 req/min ; 120 r/m + burst laisse large pour
    # un opérateur mais plafonne un scanner. Incident 2026-05-17.
    limit_req_zone $binary_remote_addr zone=proxy:10m rate=120r/m;
    # Listener public /fai (système de paiement). Exposé sur Internet SANS filtrage
    # d'IP, donc plafonné — mais le plafond doit laisser passer un BATCH : le
    # paiement envoie les déblocages de la nuit d'un coup au matin, et à 30r/m +
    # burst 10 tout ce qui dépassait la dizaine se prenait un 503 (or on leur a dit
    # de ne pas faire de retry → ces clients-là ne seraient jamais rétablis).
    # 120r/m + burst 60 absorbe le batch ; un bruteforce de la clé (48 caractères
    # aléatoires) reste hors de portée à ce débit.
    limit_req_zone $binary_remote_addr zone=fai:10m rate=120r/m;
    # Adoption d'équipements (POST /uisp/assign), consommée par le système de
    # paiement sur la VIP .229. Zone SÉPARÉE de `api` (60r/m) : les adoptions
    # arrivent par lots quand une équipe d'installation termine sa tournée, et
    # le plafond général les ferait tomber en 503 au milieu du lot. Séparée de
    # `fai` aussi, pour qu'un batch de déblocages et un batch d'adoptions ne se
    # disputent pas le même compteur.
    limit_req_zone $binary_remote_addr zone=uisp_assign:10m rate=120r/m;

    # Docker embedded DNS — nginx re-résout les noms `backend`/`frontend`
    # toutes les 30s. Sans ça, un rebuild qui change l'IP du container backend
    # laissait nginx pointer sur l'ancienne IP jusqu'au prochain restart manuel.
    # Les `set` ci-dessous combinés avec une variable dans proxy_pass forcent
    # nginx à utiliser le resolver au lieu de résoudre une fois au démarrage.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---------------------------------------------------------------
    # Redirection HTTP -> HTTPS
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------
    # Reverse proxy HTTPS
    # ---------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Sécurité de base
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Sous-réseau de l'attaquant du 2026-05-17 (IoC). nginx étant bindé
        # 127.0.0.1, ces IP ne peuvent déjà plus arriver ; ce deny est une
        # ceinture-bretelles si l'accès devait être ré-élargi un jour.
        deny 85.203.47.0/24;
        allow all;

        # Proxy du dashboard — rate-limité (le code Next y injecte la clé API ;
        # c'est la cible naturelle d'un scanner). Prioritaire (^~) sur `location /`.
        location ^~ /api/proxy/ {
            limit_req zone=proxy burst=40 nodelay;
            set $proxy_upstream http://frontend:3000;
            proxy_pass         $proxy_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Frontend Next.js (toutes les routes)
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass         $frontend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # WebSocket support (hot-reload en dev, SSE éventuel)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }

        # Adoption d'un équipement dans UISP (système de paiement, via la VIP
        # publique .229). Prioritaire (^~) sur `location /api/v1/` ci-dessous,
        # dont les réglages généraux ne conviennent pas à cette route :
        #
        #  - `proxy_read_timeout 120s` (contre 30s) : quand l'équipement est
        #    absent du contrôleur, l'association lui pose sa clé UISP PAR SSH
        #    avant d'associer. À 30s le client reçoit un 504 alors que
        #    l'adoption a réussi — exactement le piège déjà corrigé sur /fai.
        #    Mesuré le 2026-08-11 : 12s en cas normal, 504 à 30s sinon.
        #  - zone `uisp_assign` (120r/m) : les adoptions arrivent par lots.
        #
        # ⚠️ Cette route n'est PAS servie sur le listener :8443 (.233), qui reste
        # restreint à /fai. Elle passe par la VIP FortiGate .229, dont l'allowlist
        # d'IP source constitue une deuxième barrière devant la clé cloisonnée.
        location ^~ /api/v1/uisp/assign {
            limit_req zone=uisp_assign burst=60 nodelay;
            # 429 plutôt que le 503 par défaut : un intégrateur lit « ralentis »,
            # là où un 503 se confond avec une panne et déclenche des retries.
            limit_req_status 429;
            set $assign_upstream http://backend:8000;
            proxy_pass         $assign_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Backend FastAPI — accès direct depuis outils externes
        # (le frontend passe déjà par /api/proxy -> backend)
        location /api/v1/ {
            limit_req zone=api burst=30 nodelay;
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ---------------------------------------------------------------
    # Listener PUBLIC — système de paiement (docker-compose.public.yml)
    #
    # Publié sur l'IP publique du serveur (PUBLIC_BIND_IP:443 -> ce :8443), donc
    # atteignable par n'importe qui sur Internet. Il n'expose QUE /api/v1/fai
    # (block / unblock / status) : tout le reste — dashboard, /api/v1/devices,
    # /uisp/sync… — renvoie 404 et reste invisible d'Internet. C'est la contrainte
    # centrale de ce bloc : le serveur public de mai 2026 s'est fait vider parce
    # que l'API entière était joignable (incident 2026-05-17).
    #
    # L'authentification reste FAI_API_KEY (clé cloisonnée aux routes /fai, cf.
    # deps.require_fai_client) : cette exposition n'accorde aucun accès en soi.
    # Le listener LAN/tunnel ci-dessus est inchangé et sert toujours le dashboard.
    # ---------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        deny 85.203.47.0/24;  # IoC 2026-05-17
        allow all;

        location ^~ /api/v1/fai/ {
            limit_req zone=fai burst=60 nodelay;
            # 429 (et non le 503 par défaut) : un intégrateur lit « ralentis », là où
            # un 503 se confond avec une panne du service et déclenche des retries.
            limit_req_status 429;
            set $fai_upstream http://backend:8000;
            proxy_pass         $fai_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Un appel /fai attend le SSH sur le LR (quelques secondes), et sous
            # batch il attend en plus son tour dans la file SSH (10 en parallèle).
            # 30s coupait la fin d'un gros batch en 504 alors que l'ordre était
            # déjà acquis en base — le client recevait une erreur pour un succès.
            proxy_read_timeout 120s;
        }

        # Tout le reste n'existe pas sur cette interface.
        location / {
            return 404;
        }
    }
}
