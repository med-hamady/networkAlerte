# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Changes vs docker-compose.yml (dev):
#   - Backend code is bind-mounted (Python is interpreted — no build step):
#     a code change only needs `restart`, not `--build`. Rebuild the backend
#     image ONLY when requirements.txt changes. The image still bakes the code
#     (COPY . .) as a fallback; the mount just overlays the live source.
#   - Frontend is still baked at build time (needs `npm run build`)
#   - Frontend uses the optimized `runner` target (next build + node server.js)
#   - Backend port bound to 127.0.0.1 only (nginx is the public entry point)
#   - Frontend port bound to 127.0.0.1 only (nginx is the public entry point)
#   - nginx reverse proxy in front, terminating TLS on 443 (redirects 80 -> 443)
#   - Resource limits prevent runaway jobs from OOM-killing the host
#   - Postgres tuned for the 31 GB server (shared_buffers, work_mem, shm_size,
#     pg_stat_statements preloaded, max_connections=200)
#   - Per-process DB pools sized against max_connections (see postgres)

services:
  # Postgres réglé pour le serveur de prod (31 Go de RAM, 8 cœurs). Sans ce bloc,
  # il tournait sur les valeurs PAR DÉFAUT de l'image — 128 Mo de cache. Mesuré le
  # 2026-09-11 (scripts/diag-perf.sh) : 52 % des lectures servies par le cache
  # Postgres (> 99 % attendu), et 8,7 M pages écrites par les requêtes elles-mêmes
  # contre 221 k par les checkpoints, faute de place pour les garder en mémoire.
  # ⚠️ PROD SEULEMENT : ces tailles supposent les 31 Go du serveur. Un poste de dev
  #    qui les recevrait refuserait de démarrer Postgres ou swapperait.
  # ⚠️ Toute modification ici exige de RECRÉER le conteneur — `restart` relance
  #    l'ancienne commande : `dc up -d postgres`. Vérifier ensuite avec
  #    `dc exec postgres psql -U supervisor -d network_supervisor -c 'SHOW shared_buffers;'`.
  postgres:
    command:
      - postgres
      # ~25 % de la RAM : le cache propre de Postgres. Plus haut, il doublonne le
      # cache du système au lieu de s'y ajouter.
      - -c
      - shared_buffers=8GB
      # Ce que l'optimiseur peut compter en cache (Postgres + système). N'alloue
      # RIEN : sert seulement à préférer un index quand ses pages sont en mémoire.
      - -c
      - effective_cache_size=20GB
      # VACUUM, CREATE INDEX, REFRESH MATERIALIZED VIEW. Plafond PAR worker
      # d'autovacuum (3 par défaut) → 3 Go au pire.
      - -c
      - maintenance_work_mem=1GB
      # Mémoire de tri / hachage par nœud de requête avant de déborder sur disque
      # (4 Mo par défaut ; 1,2 Go de fichiers temporaires relevés).
      - -c
      - work_mem=32MB
      # Classement des requêtes coûteuses (temps cumulé, appels, moyenne) — lu
      # par scripts/diag-perf.sh. Doit être chargé AU DÉMARRAGE du serveur : sans
      # cette ligne, l'extension créée par migration existe mais ne mesure rien.
      # Surcoût négligeable (quelques % sur des requêtes très courtes).
      - -c
      - shared_preload_libraries=pg_stat_statements
      # 200 connexions (100 par défaut). BUDGET, au pire, avec les réservoirs
      # SQLAlchemy posés ci-dessous (pool + overflow par process) :
      #   backend 4 workers × 15 = 60 · scheduler 15 · heavy 15
      #   poll-ltu 25 · poll-airos 25 · ping-lr/switch/af60/netflow 4 × 8 = 32
      #   = 172, sous 200 − 3 réservées au superutilisateur, avec de la marge
      #   pour psql et les scripts. Vérifié par tests/test_db_connection_budget.py :
      #   relever un réservoir ou un nombre de workers sans relever ceci échoue.
      # ~10 Mo par connexion réellement ouverte : négligeable sur 31 Go.
      - -c
      - max_connections=200
    # Les requêtes parallèles échangent via /dev/shm, que Docker limite à 64 Mo :
    # au-delà, « could not resize shared memory segment » en pleine requête.
    shm_size: 1g

  backend:
    # Bind-mount du code (Python interprété) : un changement de code ne demande
    # qu'un `restart`, pas un `--build`. Rebuild de l'image seulement si
    # requirements.txt change. Les deps restent dans l'image (site-packages),
    # le mount n'écrase que /app (source + entrypoint, versionnés).
    volumes:
      - ./backend:/app
    # Pas de bind host réseau: nginx parle au backend via le réseau Docker interne.
    # Pour debug, exposer ponctuellement: docker compose ... run --service-ports backend
    ports: !reset []
    environment:
      # Le scheduler tourne dans son propre container (service `scheduler` ci-dessous).
      # Activer ici dupliquerait chaque job → SSH/alertes en double.
      SCHEDULER_ENABLED: "false"
      # API stateless : on peut scaler les workers en toute sécurité maintenant
      # que le scheduler est isolé. 4 sur 8 cœurs (2 avant le 2026-09-17) : le
      # serveur tourne à ~80 % de CPU libre. ⚠️ Chaque worker a SON réservoir de
      # connexions (15) : cf. le budget sous `max_connections`.
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
    deploy:
      resources:
        limits:
          # 1,5 Go : ~336 Mo mesurés à 2 workers (66 % de l'ancienne limite de
          # 512 Mo) — à 4 workers la limite aurait été dépassée (OOM).
          memory: 1536m

  # Scheduler "fast" : disponibilité (device_ping) + maintenance, tout async
  # léger. Isolé du container "heavy" ci-dessous pour que le heartbeat de
  # disponibilité ne soit JAMAIS affamé par la fan-out SSH (GIL). À ~1000+
  # devices, un scheduler unique gelait le device_ping ~20 min (last_seen figé).
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Même bind-mount que backend (image partagée) : code à chaud, restart suffit.
    volumes:
      - ./backend:/app
    environment:
      # Force-on même si le .env l'a désactivé : ce container n'existe que pour ça.
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "fast"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        # Attend que l'API tourne (donc que les migrations Alembic soient passées).
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Scheduler "ping-lr" : le ping des LR CLIENTS, seul dans son process. Le sweep
  # LR porte ~600 hôtes et, quand beaucoup sont réellement down (panne côté
  # abonné = normal), sa re-confirmation isolée lance des centaines de sous-
  # process `ping`. Dans le container "fast", cette rafale disputait le CPU et
  # l'event loop au sweep infra — or l'infra est peu nombreuse, critique, et la
  # SEULE à ouvrir des incidents : sa mesure de disponibilité ne doit dépendre de
  # rien d'autre. Même raison que le split fast/heavy, un cran plus fin.
  scheduler-ping-lr:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Même bind-mount que backend (image partagée) : code à chaud, restart suffit.
    volumes:
      - ./backend:/app
    environment:
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "ping-lr"
      # Petit consommateur de base : réservoir réduit, cf. le budget de
      # connexions sous `max_connections` (service postgres).
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Un seul job async + des sous-process `ping` de courte vie.
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Scheduler "heavy" : SSH (sonde transit/latence LR, lr_plan, client_block) +
  # snmp/power/uisp_sync/switch_port. Sa pression GIL/threads reste confinée ici
  # → n'impacte plus la disponibilité. Les polls HTTP ltu/airos/af60 en ont été
  # SORTIS (containers dédiés ci-dessous) : leurs fetches async étaient affamés
  # par les threads SSH de ce container.
  scheduler-heavy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Même bind-mount que backend (image partagée) : code à chaud, restart suffit.
    volumes:
      - ./backend:/app
    environment:
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "heavy"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Plus de RAM que le "fast" : pool de threads SSH (lr_probe_concurrency)
          # + fan-outs API sur tout le parc.
          # 1,5 Go depuis le 2026-09-17 : le renforcement des blocages tient
          # désormais 8 sessions SSH en parallèle (296 Mo mesurés avant).
          memory: 1536m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Scheduler "poll-af60" : le poll HTTP des AF60, SEUL. Sorti de "heavy" parce
  # que ses ~30 fetches HTTP async y étaient affamés par les threads SSH (GIL) et
  # par les tours ltu/airos de plusieurs minutes. Seul, son tour tombe à quelques
  # secondes → la courbe débit/capacité de la fiche a un point par minute.
  # Scheduler "poll-switch" : le poll SNMP des SWITCHES, SEUL.
  #
  # ⚠️ Isolé pour une raison vécue, pas par symétrie. Les switches partageaient le
  # tour des ~100 radios et, leur collecte étant la plus lente (28 ports), ils
  # étaient traités EN DERNIER : tout incident amont les privait de leur écriture.
  # Constaté le 2026-08-11 — 14 h sans une seule métrique de switch, donc
  # switch_port_down / switch_port_speed_low / fiber_link_down aveugles, pendant
  # que le job « tournait » normalement pour les radios.
  #
  # Le parc n'en compte qu'une quinzaine : un tour dure quelques secondes.
  scheduler-poll-switch:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "poll-switch"
      # Petit consommateur de base : réservoir réduit, cf. le budget de
      # connexions sous `max_connections` (service postgres).
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # ~17 switches, SNMP async, phase 2 courte.
          # 512 Mo (384 avant le 2026-09-17) : marge sur ~100 Mo mesurés.
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  scheduler-poll-af60:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "poll-af60"
      # Petit consommateur de base : réservoir réduit, cf. le budget de
      # connexions sous `max_connections` (service postgres).
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "5"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # ~30 backhauls, HTTP async, phase 2 minuscule.
          # 512 Mo (384 avant le 2026-09-17) : marge sur ~100 Mo mesurés.
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Scheduler "poll-ltu" : le poll HTTP des Rockets LTU + fan-out des LR, SEUL.
  # Sa phase 2 persiste des centaines de LR en série (tour long) — isolé, ce tour
  # ne ralentit plus af60 ni airos. (Optimiser sa phase 2 reste un chantier à part.)
  scheduler-poll-ltu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "poll-ltu"
      # 16 LR persistés en parallèle (8 avant le 2026-09-17) : possible depuis
      # que la file est entrelacée par Rocket (`_interleave_by_parent`) — avant,
      # les tâches se sérialisaient de toute façon sur le même verrou. Le
      # réservoir DOIT suivre (chaque tâche tient une connexion) : 5 + 20 = 25,
      # sinon les tâches attendent le réservoir au lieu du verrou.
      POLL_PERSIST_CONCURRENCY: "16"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "20"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 1 Go (768 avant le 2026-09-17) : deux fois plus de LR en vol.
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Scheduler "poll-airos" : le poll HTTP airOS des LR airMAX, SEUL. Même raison
  # que poll-ltu — grosse phase 2 sérielle, isolée pour ne plus affamer les autres.
  scheduler-poll-airos:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      SCHEDULER_ENABLED: "true"
      RUN_MODE: "scheduler"
      SCHEDULER_GROUP: "poll-airos"
      # 16 LR persistés en parallèle (8 avant le 2026-09-17) : possible depuis
      # que la file est entrelacée par Rocket (`_interleave_by_parent`) — avant,
      # les tâches se sérialisaient de toute façon sur le même verrou. Le
      # réservoir DOIT suivre (chaque tâche tient une connexion) : 5 + 20 = 25,
      # sinon les tâches attendent le réservoir au lieu du verrou.
      POLL_PERSIST_CONCURRENCY: "16"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "20"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 1 Go (768 avant le 2026-09-17) : deux fois plus de LR en vol.
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # NetFlow collector — receives NetFlow from the edge router (MikroTik). The
  # loopback port from docker-compose.yml is useless here (the router can't reach
  # the server's loopback), so we drop it; the ONLY publish address is added by
  # docker-compose.lan.yml on the LAN IP (never 0.0.0.0 — same rule as nginx).
  # Restrict the source to the router at the host/FortiGate firewall (NetFlow is
  # unauthenticated UDP).
  netflow-collector:
    ports: !reset []
    environment:
      # Petit consommateur de base : réservoir réduit, cf. le budget de
      # connexions sous `max_connections` (service postgres).
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "5"
    deploy:
      resources:
        limits:
          # 512m: the iptoasn v4+v6 BGP tables (~700k prefixes) are held in memory
          # for O(log n) ASN lookups. Was 256m before that source was added.
          # 1 Go (512 avant le 2026-09-17) : 225 Mo mesurés au repos, et le
          # collecteur agrège en mémoire entre deux écritures.
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        # Inlined into the client bundle at build time (see frontend/Dockerfile).
        # Changing the key in .env requires a rebuild, not just a restart.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    volumes: !reset []
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Bound to 127.0.0.1 only — the supervisor is NOT exposed on the public
    # interface. Public/remote admin access goes through an SSH tunnel:
    #   ssh -L 8443:127.0.0.1:443 a2@<server>  →  https://localhost:8443/
    # Rationale: incident 2026-05-17 — a public 0.0.0.0 binding let an
    # automated scanner reach /api/proxy and wipe the device inventory.
    #
    # Direct LAN access (no tunnel) is now supported by the auth layer (login +
    # server-side sessions, see backend/app/services/auth_service.py). Enable it
    # by ALSO composing docker-compose.lan.yml, which adds a binding on the
    # server's private LAN IP only — never 0.0.0.0, so the public interface
    # stays tunnel-only. Do NOT bind 0.0.0.0 here.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
